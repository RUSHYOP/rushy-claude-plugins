# Generated from config/mcp-servers.json — MCP servers default OFF.
# Merge into ~/.grok/config.toml or enable the matching rushy plugin instead.

[mcp_servers.whispr-flow]
enabled = false
url = "https://api.wisprflow.ai/connect/mcp"

[mcp_servers.obsidian]
enabled = false
command = "npx"
args = ["-y", "@mauricio.wolff/mcp-obsidian@latest", "${OBSIDIAN_VAULT_PATH}"]

[mcp_servers.atlassian-confluence]
enabled = false
command = "npx"
args = ["-y", "mcp-remote@latest", "https://mcp.atlassian.com/v1/mcp/authv2", "--header", "X-Atlassian-Site:${ATLASSIAN_SITE}"]

[mcp_servers.pdf-reader]
enabled = false
command = "npx"
args = ["-y", "@sylphx/pdf-reader-mcp"]

[mcp_servers.nebulastudio-mcp]
enabled = false
url = "https://designeridst.ramcouat.com/coregwops/proxy/coremcp/mcp"

[mcp_servers.playwright]
enabled = false
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[mcp_servers.mcp-uds-server]
enabled = false
url = "http://hcmwascnv70.pearl.com/UDSMCPServer/mcp"

[mcp_servers.rapids-mcp]
enabled = false
url = "http://hcmwascnv70.pearl.com/RapidsMCPServer/mcp"
[mcp_servers.rapids-mcp.headers]
Authorization = "Bearer ${RAPIDS_MCP_TOKEN}"
context-ou-id = "27"
context-role-name = "MCP_Role"
context-lang-id = "1"

[mcp_servers.excalidraw]
enabled = false
url = "https://api.excalidraw.com/api/v1/mcp"
[mcp_servers.excalidraw.headers]
Authorization = "Bearer ${EXCALIDRAW_MCP_TOKEN}"

[mcp_servers.miro-mcp]
enabled = false
command = "npx"
args = ["-y", "mcp-remote@latest", "https://mcp.miro.com/"]

[mcp_servers.shadcn]
enabled = false
command = "npx"
args = ["-y", "shadcn@latest", "mcp"]

[mcp_servers.frontend-checklist]
enabled = true
url = "https://mcp.frontendchecklist.io"

[mcp_servers.rxds-figma-mcp]
enabled = false
command = "node"
args = ["${RXDS_FIGMA_MCP_ENTRY}"]
[mcp_servers.rxds-figma-mcp.env]
FIGMA_ACCESS_TOKEN = "${FIGMA_ACCESS_TOKEN}"
RXDS_COMPONENTS_PATH = "${RXDS_COMPONENTS_PATH}"
RXDS_FIGMA_MCP_CONFIG = "${RXDS_FIGMA_MCP_CONFIG}"
